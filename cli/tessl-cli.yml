generated: '2026-07-21'
method: searched
source: https://docs.tessl.io/reference/cli-commands.md
name: Tessl CLI
binary: tessl
current_version: 0.92.0
docs: https://docs.tessl.io/reference/cli-commands.md
install_docs: https://docs.tessl.io/introduction-to-tessl/set-up-tessl/installation.md
install:
  - method: curl
    command: curl -fsSL https://get.tessl.io | sh
    note: Native install (recommended); verifies cryptographically signed release manifests (0.92.0+).
  - method: homebrew
    command: brew install tesslio/tap/tessl
  - method: winget
    command: winget install tessl.tessl
  - method: npm
    command: npm install -g @tessl/cli
    note: deprecated
auth:
  mechanism: device-code OAuth 2.0
  login: tessl login
  device_url: https://auth.tessl.io/device
  identity_providers: [GitHub, Google]
  ci_token_env: TESSL_TOKEN
auto_update:
  enabled: true
  interval_hours: 3
  disable_env: TESSL_AUTO_UPDATE_INTERVAL_MINUTES=0
  channels: [latest, beta]
command_groups:
  - group: Authentication
    commands: [login, logout, whoami]
  - group: Setup and initialization
    commands: [init, project create, project link, project repair]
  - group: Project dependencies
    commands: [install, search, uninstall, list, outdated, update]
  - group: Skill management
    commands: [skill new, skill import, skill lint, skill publish, skill review]
  - group: Tessl Review (server-side)
    commands: [review run, review run quality, review run security, review view, review list, review retry, review fix]
  - group: Plugin management
    commands: [plugin new, plugin lint, plugin migrate, plugin pack, plugin info, plugin publish, plugin unpublish, plugin archive]
  - group: Organization management
    commands: [org list]
  - group: Workspace management
    commands: [workspace create, workspace list, workspace delete, workspace add-member, workspace remove-member, workspace list-members, workspace archive, workspace unarchive]
  - group: Configuration management
    commands: [config get, config set, config list, config add, config remove]
  - group: Diagnostics and utilities
    commands: [doctor, feedback]
  - group: CLI self-management
    commands: [cli update]
  - group: API key management
    commands: [api-key create, api-key list, api-key delete]
  - group: Model Context Protocol (MCP)
    commands: [mcp start, mcp proxy]
  - group: Repository
    commands: [repo select-commits]
  - group: Inventory
    commands: [inventory import]
  - group: Scenario management (beta)
    commands: [scenario generate, scenario list, scenario view, scenario download]
  - group: Evaluations (beta)
    commands: [eval run, eval list, eval view, eval retry]
  - group: Agent
    commands: [agent, agent mcp add, agent mcp get, agent mcp list, agent mcp remove]
  - group: Change (CI policy gates)
    commands: [change review, change risk, change risk init]
key_flows:
  - name: Install and configure an agent
    steps: [tessl init --agent claude-code, tessl install tessl/svelte]
  - name: Publish a skill to the registry
    steps: [tessl skill new, tessl skill lint, tessl skill publish --public]
  - name: Gate skill quality/security in CI
    steps: ["tessl review run --threshold 80 --json", "tessl review run security --fail-on high"]
  - name: Bridge a workspace MCP server into an agent
    steps: [tessl mcp proxy engteam/linear]
supported_agents: [claude-code, cursor, gemini, codex, openhands, openclaw, copilot, copilot-vscode, agents, tessl-agent]
