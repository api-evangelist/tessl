name: Tessl
description: >-
  Tessl is an agent-enablement platform that gives engineering teams a management
  layer for AI agent skills and plugins: continuously build, test, distribute, and
  optimize the context that coding agents rely on, with the security and governance
  of enterprise software. It centers on the Tessl Registry (3,000+ public skills
  plus private workspaces), the Tessl CLI, a first-party MCP server and workspace
  MCP gateway, Snyk-powered security scanning with install policies, and quality
  reviews and evaluations that can gate skills in CI. Skills and plugins are
  agent-agnostic, working across Claude Code, Cursor, Copilot, Gemini, and others.
  Founded by Guy Podjarny (Snyk); backed by Accel and GV.
